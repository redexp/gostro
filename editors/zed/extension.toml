id = "gostro"
name = "Gostro"
description = "Syntax highlighting for gostro templates (.gostro)"
version = "0.1.0"
schema_version = 1
authors = ["gostro"]

[grammars.gostro]
# Zed fetches the grammar from a git repository at a specific commit and compiles
# src/parser.c to wasm. For local development a file:// URL works too.
repository = "https://github.com/redexp/gostro"
rev = "REPLACE_WITH_COMMIT_SHA"
path = "editors/zed/tree-sitter-gostro"
